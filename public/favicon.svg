<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#2A1C4A"/><stop offset="1" stop-color="#07060F"/></radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF4E0"/><stop offset=".35" stop-color="#FFC27A"/><stop offset=".75" stop-color="#E0782C"/><stop offset="1" stop-color="#7A2E12"/></linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE2B0"/><stop offset=".6" stop-color="#F59A4A"/><stop offset="1" stop-color="#8A3A16"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset=".4" stop-color="#FF9A4A" stop-opacity=".55"/><stop offset="1" stop-color="#FF9A4A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <circle cx="32" cy="33" r="24" fill="url(#glow)"/>
  <g transform="rotate(-8 32 33)" fill="none" stroke-linecap="round">
    <!-- far half of the disk, and its image bent up over the top -->
    <path d="M8 33 A24 6 0 0 1 56 33" stroke="url(#disk)" stroke-width="3.4"/>
    <path d="M16.5 34 A15.5 15.5 0 0 1 47.5 34" stroke="url(#hat)" stroke-width="2.8" stroke-linecap="butt"/>
    <!-- the shadow and its photon ring -->
    <circle cx="32" cy="33" r="10.5" fill="#000" stroke="none"/>
    <circle cx="32" cy="33" r="11" stroke="#FFE2B0" stroke-width="1.1" opacity=".9"/>
    <!-- near half, in front -->
    <path d="M8 33 A24 6 0 0 0 56 33" stroke="url(#disk)" stroke-width="4.2"/>
  </g>
</svg>
